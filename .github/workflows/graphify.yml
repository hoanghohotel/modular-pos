name: Graphify Code Knowledge Graph

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-graph:
    name: Build Graphify graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Graphify
        run: uv tool install graphifyy
      - name: Build code knowledge graph
        run: graphify .
      - name: Upload Graphify output
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out
          path: graphify-out/
          if-no-files-found: error
          retention-days: 14
