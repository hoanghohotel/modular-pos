name: Graphify Code Knowledge Graph

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-graph:
    name: Build Graphify graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Graphify
        run: uv tool install --python 3.12 'graphifyy[sql]==0.9.93'
      - name: Build code knowledge graph
        run: |
          graphify extract . --code-only --max-workers 2
          graphify cluster-only . --no-label
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/graph.html
      - name: Upload Graphify output
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out
          path: graphify-out/
          if-no-files-found: error
          retention-days: 14
