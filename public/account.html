<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tài khoản · Modular POS</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;color:light-dark(#17221f,#e9f2ee);background:light-dark(#f2f6f3,#111916)}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:640px;margin:5vh auto}header{margin-bottom:32px}h1{font-size:28px;margin-bottom:8px}p{line-height:1.6}section{background:light-dark(#fff,#19251f);padding:24px;border:1px solid light-dark(#d7e4dc,#34473c);border-radius:16px;margin:20px 0}form{display:grid;gap:16px}label{display:grid;gap:8px}input,select,button{font:inherit;min-height:46px;padding:10px 12px;border-radius:8px;border:1px solid light-dark(#b7c9bf,#52675b);width:100%}button{cursor:pointer;background:light-dark(#176445,#99dfb7);color:light-dark(#fff,#10271a);font-weight:600}button.secondary{background:transparent;color:inherit}button:disabled{opacity:.6;cursor:wait}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions>*{flex:1;min-width:130px}[hidden]{display:none!important}#status{min-height:28px;overflow-wrap:anywhere}a{color:inherit}small{line-height:1.5}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #65b890;outline-offset:3px}
</style>
<script src="/app-config.js"></script>
</head>
<body><main>
<header><a href="/">Modular POS</a><h1>Tài khoản & cửa hàng</h1><p>Đăng nhập và truy cập cửa hàng được cấp quyền.</p></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="loginPanel"><h2>Đăng nhập</h2>
<form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required maxlength="255"></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label><div class="actions"><button type="submit">Đăng nhập</button><button type="button" class="secondary" id="signup">Tạo tài khoản</button></div></form>
<p><small>Tài khoản mới cần xác nhận email trước khi tạo cửa hàng. Phiên làm việc kết thúc khi tải lại hoặc đóng trang.</small></p></section>
<section id="workspacePanel" hidden><h2>Cửa hàng của bạn</h2><p id="identity"></p><label>Chọn cửa hàng<select id="stores"></select></label><p id="storeSummary"></p><button id="logout" class="secondary" type="button">Đăng xuất</button></section>
<section id="bootstrapPanel" hidden><h2>Tạo không gian làm việc</h2><form id="bootstrapForm"><label>Tên thương hiệu<input id="brand" required maxlength="200"></label><label>Mã thương hiệu<input id="slug" required pattern="[a-z0-9][a-z0-9-]{1,62}[a-z0-9]" minlength="3" maxlength="64" placeholder="ca-phe-cua-ban"></label><label>Tên cửa hàng<input id="storeName" required maxlength="200"></label><label>Địa chỉ<input id="address" required maxlength="500"></label><button type="submit">Tạo cửa hàng đầu tiên</button></form></section>
</main><script type="module" src="/assets/account.mjs"></script></body></html>
